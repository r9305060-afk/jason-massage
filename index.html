<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>傑森的按摩天地 - 雲端工作管理系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen">

  <!-- ==================== 1. 鎖定驗證畫面 ==================== -->
  <div id="lockScreen" class="fixed inset-0 z-50 bg-stone-900 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center border border-stone-100">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
        <i class="fa-solid fa-spa"></i>
      </div>
      <h2 class="text-xl font-bold text-stone-800">傑森的按摩天地</h2>
      <p class="text-xs text-stone-500 mt-1 mb-5">專業身體調理 · 雲端同步工作站</p>
      
      <div class="space-y-3">
        <div class="relative">
          <input type="password" id="unlockPwdInput" placeholder="請輸入訪問密碼" 
                 class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition-all font-mono">
        </div>
        <p id="pwdErrorMsg" class="text-xs text-red-500 hidden font-medium">密碼不正確，請重新輸入</p>
        
        <button id="btnUnlock" onclick="checkUnlock()" class="w-full py-3.5 bg-emerald-700 hover:bg-emerald-800 active:scale-95 text-white font-semibold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-lock-open"></i>
          <span>解鎖進入系統</span>
        </button>
      </div>

      <div class="mt-4 pt-4 border-t border-stone-100">
        <button onclick="forceResetPassword()" class="text-xs text-stone-400 hover:text-emerald-700 underline">
          忘記密碼？恢復預設
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 主應用程式容器 ==================== -->
  <div id="appContainer" class="hidden min-h-screen flex flex-col md:flex-row pb-20 md:pb-0">
    
    <!-- 桌面側邊欄 -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-stone-200 p-5 shrink-0">
      <div class="flex items-center gap-3 pb-5 border-b border-stone-100">
        <div class="relative cursor-pointer group" onclick="openAvatarModal()">
          <img id="sidebarAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" 
               class="w-12 h-12 rounded-full object-cover border-2 border-emerald-600 shadow-sm group-hover:opacity-80 transition-all">
          <div class="absolute inset-0 flex items-center justify-center bg-black/40 text-white rounded-full opacity-0 group-hover:opacity-100 transition-all text-xs">
            <i class="fa-solid fa-camera"></i>
          </div>
        </div>
        <div>
          <h1 class="font-bold text-stone-800 text-base">傑森的按摩天地</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <p id="cloudSyncStatusDesktop" class="text-[11px] text-emerald-700 font-medium">雲端即時連線</p>
          </div>
        </div>
      </div>

      <!-- 導航連結 -->
      <nav class="mt-6 flex-1 space-y-1">
        <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-emerald-800 bg-emerald-50 transition-all" data-tab="dashboard">
          <i class="fa-solid fa-chart-pie w-5"></i><span>營運儀表板</span>
        </button>
        <button onclick="switchTab('appointments')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-stone-600 hover:bg-stone-50 transition-all" data-tab="appointments">
          <i class="fa-solid fa-calendar-check w-5"></i><span>預約排程</span>
        </button>
        <button onclick="switchTab('clients')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-stone-600 hover:bg-stone-50 transition-all" data-tab="clients">
          <i class="fa-solid fa-user-tag w-5"></i><span>熟客身體檔案</span>
        </button>
        <button onclick="switchTab('finance')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-stone-600 hover:bg-stone-50 transition-all" data-tab="finance">
          <i class="fa-solid fa-wallet w-5"></i><span>財務明細</span>
        </button>
      </nav>

      <!-- 側欄底部動作 -->
      <div class="pt-4 border-t border-stone-100 space-y-2">
        <button onclick="openAiModal()" class="w-full flex items-center justify-center gap-2 py-2.5 px-3 bg-gradient-to-r from-teal-600 to-emerald-600 text-white text-xs font-semibold rounded-xl shadow-sm hover:opacity-90 transition-all">
          <i class="fa-solid fa-wand-magic-sparkles"></i><span>AI 後台助理</span>
        </button>
        <button onclick="lockSystem()" class="w-full flex items-center justify-center gap-2 py-2 px-3 text-stone-400 hover:text-stone-700 text-xs transition-all">
          <i class="fa-solid fa-lock"></i><span>鎖定系統</span>
        </button>
      </div>
    </aside>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      
      <!-- 手機頂部 Header -->
      <header class="md:hidden bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-2.5">
          <img id="mobileAvatar" onclick="openAvatarModal()" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" 
               class="w-8 h-8 rounded-full object-cover border border-emerald-600 cursor-pointer">
          <div>
            <h1 class="font-bold text-stone-800 text-sm">傑森的按摩天地</h1>
            <div class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <p id="cloudSyncStatusMobile" class="text-[10px] text-emerald-700 font-medium">雲端同步中</p>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="openAiModal()" class="px-2.5 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium flex items-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i><span>AI 後台</span>
          </button>
          <button onclick="lockSystem()" class="p-2 text-stone-400 hover:text-stone-600">
            <i class="fa-solid fa-lock"></i>
          </button>
        </div>
      </header>

      <!-- 主要內容頁面 -->
      <div class="p-4 md:p-8 max-w-6xl mx-auto w-full space-y-6">

        <!-- ===== Tab 1: 營運儀表板 ===== -->
        <section id="view-dashboard" class="tab-view space-y-6">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm">
              <span class="text-xs text-stone-400 font-medium">本月傑森實拿</span>
              <div class="mt-1 flex items-baseline gap-1">
                <span class="text-xs font-semibold text-emerald-700">NT$</span>
                <span id="statMonthlyNet" class="text-xl md:text-2xl font-black text-emerald-800 font-mono">0</span>
              </div>
              <span class="text-[10px] text-stone-400 mt-1 block">客牌價: NT$ <span id="statMonthlyGross">
